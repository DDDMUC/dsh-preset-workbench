# The `cetacea` (鲸鱼娘) agent preset: a fixed-prompt roleplay composition
# copied from the builtin `minimal` preset.
#
# The persona is the complete system prompt (complete: true), so global
# identity, Web orientation, tool guidance, and later assembly listeners
# cannot add prompt text. Runtime context snapshots are suppressed
# (includeRuntimeContext: false), and the model composes only the persistent
# shell (`bash` on POSIX, `pwsh` on win32) and `str_replace_editor`.
#
# The persona TEXT lives in `persona.md` beside this file - edit that file,
# never this one. The `persona-file` row is a local loader script that reads
# persona.md at mount time and registers the same `deployment:persona`
# section @deepseek-ai/dsh-persona would.
#
# One addition over `minimal`: the compaction group. Long roleplay sessions
# grow unbounded context, so this preset mounts the same compaction stack the
# shipped `standard` preset uses. `tokenMeter` stays on the HOST plane; the
# rows here resolve that one instance.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: ./persona-file.mjs
  config:
    complete: true
    includeRuntimeContext: false

# ── persistent shell ────────────────────────────────────────────────────────

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. Exactly one shell stack mounts per host: the bash stack gates off
# win32 and its pwsh twin gates off POSIX, mirroring the one-shot shell rows.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# ── filesystem ──────────────────────────────────────────────────────────────

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# ── compaction ──────────────────────────────────────────────────────────────

# Long roleplay sessions grow unbounded context, so this preset mounts the
# compaction stack (copied from the shipped `standard` composition).
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024