# The `bare` (空提示词) agent preset: no system prompt, no tools, no runtime
# context.
#
# This is the smallest composition that still runs a session. Everything that
# normally speaks to the model is gone:
#
#   • persona-file.mjs registers an EMPTY complete persona section, so the
#     harness identity, tool guidance, and web-surface text are suppressed and
#     the rendered prompt is ''. Runtime context snapshots are suppressed too
#     (`includeRuntimeContext: false`), INCLUDING the `required` ones — each
#     of those gets a `required: false` empty shadow in this layer, so the
#     working-directory line no longer reaches the request.
#   • the same loader empties the inherited tool set with
#     `tools.restrict({ allow: [] })` (`noTools: true`), because host-level
#     tools are global and a preset row cannot unregister them.
#   • compaction stays mounted so a long chat does not run out of context.
#
# The prompt text is NOT here — it lives in sections.json + section.*.md and
# is empty until you add a section in the workbench.
#
# Known boundary: tools registered in the AGENT's own scope stay visible,
# because `tools.restrict` only masks inherited globals. Clearing those needs
# a host-scope plugin that rewrites their activation on `turn/start`.

# ── identity + tool surface ─────────────────────────────────────────────────

- id: persona
  name: ./persona-file.mjs
  config:
    complete: true
    includeRuntimeContext: false
    noTools: true

# ── compaction ──────────────────────────────────────────────────────────────

# Long chats grow unbounded context; this is the same stack the shipped
# `standard` preset and the other built-in templates use.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
